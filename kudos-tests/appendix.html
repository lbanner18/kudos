<!doctype html>
<meta charset="utf-8">
<title>Kudos appendix check</title>
<iframe id="f" style="width:1400px;height:900px"></iframe>
<script>
// Adds a body section and an appendix, checks the appendix prints after the sign-off, and that the Appendix tick moves a section.
const KUDOS = '/kudos/index.html';
const results = [];
const check = (name, ok, detail) => (results.push({ name, ok: !!ok, detail: ok ? undefined : detail }), !!ok);
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = document.getElementById('f');
let w, d, downloads = [], errors = [];

async function boot() {
  frame.src = KUDOS + '?' + Math.random();
  await new Promise(r => frame.onload = r);
  w = frame.contentWindow; d = w.document;
  w.addEventListener('error', e => errors.push(String(e.message)));
  w.URL.createObjectURL = blob => { downloads.push(blob); return 'blob:captured'; };
  w.HTMLAnchorElement.prototype.click = function () {};
  await wait(100);
}
const $ = s => d.querySelector(s);
const $$ = s => Array.from(d.querySelectorAll(s));
const settle = () => wait(300);
const cards = () => $$('#sectionCards > .card');
const type = (el, v) => { el.value = v; el.dispatchEvent(new w.Event('input', { bubbles: true })); };
const text = () => $('#preview').textContent;
const order = (...xs) => xs.map(x => text().indexOf(x)).every((p, i, a) => p >= 0 && (!i || p > a[i - 1]));

async function run() {
  localStorage.clear(); await boot();
  $('#btnAddSection').click(); await settle();
  type(cards()[cards().length - 1].querySelector('.secbody textarea'), 'MAIN BODY TEXT');
  $('[data-snippet="appendix"]').click(); await settle();
  const app = cards()[cards().length - 1];
  check('appendix card is ticked', app.querySelector('.apptoggle input').checked);
  type(app.querySelector('.secbody textarea'), 'APPENDIX TEXT');
  await settle();
  const signoff = $('#preview .sig').textContent.trim().slice(0, 20);
  check('body, then sign-off, then appendix', order('MAIN BODY TEXT', signoff, 'Appendix', 'APPENDIX TEXT'), text());
  // tick Appendix on the body section: it moves after the sign-off too
  const body = cards()[cards().length - 2].querySelector('.apptoggle input');
  body.click(); await settle();
  check('ticked section moves after the sign-off', order(signoff, 'MAIN BODY TEXT'), text());
  body.click(); await settle();
  check('unticked section moves back', order('MAIN BODY TEXT', signoff), text());
  downloads = []; $('#btnExport').click(); await wait(1500);
  const m = $('.modal'); if (m) { $$('.modal button').find(b => b.textContent === 'Export anyway').click(); await wait(1500); } // unfilled {{team}}
  check('docx export with an appendix', downloads.length === 1 && downloads[0].size > 5000, downloads.map(b => b.size));
  // survives a reload (autosave)
  await boot(); await settle();
  check('appendix kept after reload', order(signoff, 'APPENDIX TEXT') && cards()[cards().length - 1].querySelector('.apptoggle input').checked, text());
  check('no page errors', !errors.length, errors);
}

run().catch(e => check('test crashed', false, String(e && e.stack || e)))
  .finally(() => fetch('/results', { method: 'POST', body: JSON.stringify(results, null, 1) }));
</script>
