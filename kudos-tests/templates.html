<!doctype html>
<meta charset="utf-8">
<title>Kudos templates check</title>
<iframe id="f" style="width:1400px;height:900px"></iframe>
<script>
// Applies each variant listed in ?v=type/variant,type/variant (default: all) and checks it renders and exports.
const KUDOS = '/kudos/index.html';
const results = [];
const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail: ok ? undefined : detail });
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = document.getElementById('f');
let w, d, downloads = [], errors = [];

async function boot() {
  frame.src = KUDOS + '?' + Math.random();
  await new Promise(r => frame.onload = r);
  w = frame.contentWindow; d = w.document;
  w.addEventListener('error', e => errors.push(String(e.message)));
  w.addEventListener('unhandledrejection', e => errors.push(String(e.reason)));
  w.URL.createObjectURL = blob => { downloads.push(blob); return 'blob:captured'; };
  w.HTMLAnchorElement.prototype.click = function () {};
  await wait(100);
}
const $ = s => d.querySelector(s);
const $$ = s => Array.from(d.querySelectorAll(s));
const cards = () => $$('#sectionCards > .card');
const settle = () => wait(300);
const prompts = () => +(($('#saveStatus').textContent.match(/(\d+) unfilled prompt/) || [])[1] || 0);
// Heading text with {{placeholders}} cut out: every remaining fragment must show up in the preview
const fragments = (text, vars) => text.replace(/\{\{(\w+)\}\}/g, (m, k) => (vars.find(x => x.key === k) || {}).default || '\u0000').split('\u0000').map(s => s.trim()).filter(Boolean);
async function exportDocx() { downloads = []; $('#btnExport').click(); await wait(1500); return downloads.length === 1 ? downloads[0].size : 0; }

async function run() {
  localStorage.clear(); await boot();
  const want = (new URLSearchParams(location.search).get('v') || '').split(',').filter(Boolean);
  const list = w.INJECT_TYPES.flatMap(t => t.variants.map(v => [t, v])).filter(([t, v]) => !want.length || want.includes(t.id + '/' + v.id));
  check(`variants to check: ${list.length}`, list.length > 0, want);
  for (const [t, v] of list) {
    const key = `${t.id}/${v.id}`;
    localStorage.clear(); await boot();
    $('#btnSampleHosts').click(); await settle();
    let typeBtn;
    for (let i = 0; i < 20 && !typeBtn; i++) { typeBtn = $$('#typeGrid button').find(b => b.firstChild.textContent === t.name); if (!typeBtn) await wait(100); }
    if (!typeBtn) { check(`${key}: type button found`, false, $$('#typeGrid button').map(b => b.firstChild.textContent)); continue; }
    typeBtn.click();
    $(`#variantPanel input[value="${v.id}"]`).click();
    $('#variantPanel .variant-actions button.primary').click(); await settle();
    const preview = () => $('#preview').textContent;
    check(`${key}: one card per section`, cards().length === v.sections.length, [cards().length, v.sections.length]);
    const missing = v.sections.filter(s => s.on !== false).flatMap(s => fragments(s.heading, v.vars)).filter(f => !preview().includes(f));
    check(`${key}: headings render`, !missing.length, missing);
    v.sections.forEach((s, i) => {
      if (s.perHost) check(`${key}: per-host blocks in "${s.heading || s.id}"`, cards()[i].querySelectorAll('details.hostblock').length > 0);
      if (s.table) check(`${key}: table in "${s.heading || s.id}"`, cards()[i].querySelector('table.grid'), s.id);
    });
    const n = prompts();
    check(`${key}: prompts counted (${n})`, n > 0, $('#saveStatus').textContent);
    const size = await exportDocx();
    check(`${key}: docx export (${size} bytes)`, size > 5000, size);
    const off = cards().filter(c => c.classList.contains('off'));
    if (off.length) {
      const before = preview().length;
      off.forEach(c => c.querySelector('.sechead input[type=checkbox]').click()); await settle();
      const miss2 = v.sections.flatMap(s => fragments(s.heading, v.vars)).filter(f => !preview().includes(f));
      check(`${key}: off sections render when ticked (${off.length})`, !miss2.length && preview().length > before, miss2);
      const size2 = await exportDocx();
      check(`${key}: docx export with every section on`, size2 > size, [size, size2]);
    }
  }
  check('no page errors', !errors.length, errors);
}

run().catch(e => check('test crashed', false, String(e && e.stack || e)))
  .finally(() => fetch('/results', { method: 'POST', body: JSON.stringify(results, null, 1) }));
</script>
