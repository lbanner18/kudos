<!doctype html>
<meta charset="utf-8">
<title>Kudos event section check</title>
<iframe id="f" style="width:1400px;height:900px"></iframe>
<script>
// Checks the past-event section at the top of the type picker: one card per tagged variant, in inject order,
// clicking a card selects that type and variant, the badge shows on both, and search filters the section.
const KUDOS = '/kudos/index.html';
const results = [];
const check = (name, ok, detail) => (results.push({ name, ok: !!ok, detail: ok ? undefined : detail }), !!ok);
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = document.getElementById('f');
let w, d, errors = [];

async function boot() {
  frame.src = KUDOS + '?' + Math.random();
  await new Promise(r => frame.onload = r);
  w = frame.contentWindow; d = w.document;
  w.addEventListener('error', e => errors.push(String(e.message)));
  await wait(100);
}
const $ = s => d.querySelector(s);
const $$ = s => Array.from(d.querySelectorAll(s));
const settle = () => wait(300);
const type = (el, v) => { el.value = v; el.dispatchEvent(new w.Event('input', { bubbles: true })); };

async function run() {
  localStorage.clear(); await boot();
  const tagged = w.INJECT_TYPES.flatMap(t => t.variants.filter(v => v.event).map(v => ({ t, v })));
  const sec = $$('#eventList details.event');
  check('one section per event', sec.length === new Set(tagged.map(x => x.v.event)).size, sec.length);
  const btns = $$('#eventList button');
  check('a card per tagged variant', btns.length === tagged.length, [btns.length, tagged.length]);
  const labels = btns.map(b => b.querySelector('b').textContent);
  check('cards in inject order', labels.join() === labels.slice().sort().join(), labels);
  check('Invitational #1 has 12 injects', tagged.filter(x => x.v.event === 'MWCCDC Invitational #1').length === 12);

  const pick = btns.find(b => b.textContent.includes('SOCS09A'));
  pick.click(); await settle();
  const checked = $('#variantPanel input[name=variant]:checked');
  check('card selects its variant', checked && checked.value === 'l2-decode', checked && checked.value);
  check('variant shows the event badge', $$('#variantPanel .badge.event').some(b => b.textContent.includes('05 SOCS09A')));
  check('type shows the event badge', $$('#typeGrid button.active .badge.event').length === 1);
  $$('#variantPanel button').find(b => /Use this draft/.test(b.textContent)).click(); await settle();
  const m = $('.modal'); if (m) { $$('.modal button').pop().click(); await settle(); }
  check('using it loads the template', /Full Decode/.test($('#preview').textContent), $('#preview').textContent.slice(0, 200));

  type($('#typeSearch'), 'eval14a'); await settle();
  check('search filters the event section', $$('#eventList button').length === 1, $$('#eventList button').length);
  type($('#typeSearch'), 'zzzz-nothing'); await settle();
  check('no section when nothing matches', !$$('#eventList details').length);
  check('no page errors', !errors.length, errors);
}

run().catch(e => check('test crashed', false, String(e && e.stack || e)))
  .finally(() => fetch('/results', { method: 'POST', body: JSON.stringify(results, null, 1) }));
</script>
