<!doctype html>
<meta charset="utf-8">
<title>Kudos requirements check</title>
<iframe id="f" style="width:1400px;height:900px"></iframe>
<script>
// Inject requirements vs section headings: unmatched, unticked lines are flagged and warned about before export.
const KUDOS = '/kudos/index.html';
const results = [];
const check = (name, ok, detail) => (results.push({ name, ok: !!ok, detail: ok ? undefined : detail }), !!ok);
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = document.getElementById('f');
let w, d, downloads = [], errors = [];

async function boot() {
  frame.src = KUDOS + '?' + Math.random();
  await new Promise(r => frame.onload = r);
  w = frame.contentWindow; d = w.document;
  w.addEventListener('error', e => errors.push(String(e.message)));
  w.URL.createObjectURL = blob => { downloads.push(blob); return 'blob:captured'; };
  w.HTMLAnchorElement.prototype.click = function () {};
  await wait(100);
}
const $ = s => d.querySelector(s);
const $$ = s => Array.from(d.querySelectorAll(s));
const settle = () => wait(400);
const type = (el, v) => { el.value = v; el.dispatchEvent(new w.Event('input', { bubbles: true })); };
const flagged = () => $$('#checkList li').filter(li => li.querySelector('.nohead')).map(li => li.querySelector('span').textContent);
const exportNow = async () => { downloads = []; $('#btnExport').click(); await wait(1500); };

async function run() {
  localStorage.clear(); await boot();
  $('#btnSampleHosts').click(); await settle();
  $$('#typeGrid button').find(b => b.firstChild.textContent === 'Login banner').click();
  $('#variantPanel input[value="banner"]').click();
  $('#variantPanel .variant-actions button.primary').click(); await settle();
  check('variant fills empty requirements with its prompt asks', /Key concepts of a login banner/.test($('#checkText').value) && $$('#checkList li').length === 5, $('#checkText').value);
  type($('#checkText'), [
    '- Identify the key elements of a login banner',
    '- Install the banner on every Linux device',
    '- Provide a disaster recovery cost estimate',
    '- Cite any sources used',
  ].join('\n')); await settle();
  check('matched lines show their heading', $$('#checkList li small').some(s => /Key Elements of a Login Banner/.test(s.textContent)) && $$('#checkList li small').some(s => /Completion on Linux Devices/.test(s.textContent)), $('#checkList').textContent);
  check('unmatched lines are flagged', JSON.stringify(flagged()) === JSON.stringify(['Provide a disaster recovery cost estimate', 'Cite any sources used']), flagged());
  // tick one unmatched line: it is no longer flagged
  $$('#checkList li').find(li => /Cite any sources/.test(li.textContent)).querySelector('input').click(); await settle();
  check('ticked line is not flagged', JSON.stringify(flagged()) === JSON.stringify(['Provide a disaster recovery cost estimate']), flagged());
  await exportNow();
  const modal = $('.modal');
  check('export warns about the unmatched line', modal && /disaster recovery cost estimate/.test(modal.textContent) && !/Cite any sources/.test(modal.textContent) && !downloads.length, modal && modal.textContent);
  $$('.modal button').find(b => b.textContent === 'Cancel').click(); await wait(1500);
  check('Cancel does not export', !$('.modal') && !downloads.length, downloads.length);
  await exportNow();
  $$('.modal button').find(b => b.textContent === 'Export anyway').click(); await wait(1500);
  check('Export anyway exports', downloads.length === 1 && downloads[0].size > 5000, downloads.map(b => b.size));
  // add a section for it: no flag, no warning
  $('#btnAddSection').click(); await settle();
  const cards = $$('#sectionCards > .card');
  type(cards[cards.length - 1].querySelector('.sechead input[type=text]'), 'Disaster Recovery Cost Estimate'); await settle();
  check('a matching section clears the flag', !flagged().length, flagged());
  await exportNow();
  // the template's own [[prompts]] are still unfilled, so the export check still opens, but without a requirement line
  const m2 = $('.modal');
  check('no requirement warning once every line has a heading', m2 && !/no section/.test(m2.textContent) && /unfilled placeholder/.test(m2.textContent), m2 && m2.textContent);
  if (m2) { $$('.modal button').find(b => b.textContent === 'Export anyway').click(); await wait(1500); }
  check('Export anyway after the unfilled warning exports', downloads.length === 1, downloads.length);
  // From typed by hand with one team, signature from {{team}} with another
  type($('[data-meta="team"]'), '07'); type($('[data-meta="from"]'), 'Team 02'); await settle();
  await exportNow();
  const m3 = $('.modal');
  check('warns when From and signature name different teams', m3 && /different teams/.test(m3.textContent) && /Team 02/.test(m3.textContent) && /Team 07/.test(m3.textContent) && !downloads.length, m3 && m3.textContent);
  check('no page errors', !errors.length, errors);
}

run().catch(e => check('test crashed', false, String(e && e.stack || e)))
  .finally(() => fetch('/results', { method: 'POST', body: JSON.stringify(results, null, 1) }));
</script>
